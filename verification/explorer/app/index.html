<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vox source explorer</title>
<meta name="description" content="The OxCaml compiler with Vox, as a treemap: what each part is, what Vox changed there, where the demos live, and guided tours.">
<link rel="stylesheet" href="style.css?v={{version}}">
</head>
<body>
<header class="topbar">
  <div class="bar-title">
    <a class="home" href="../">Vox</a>
    <h1>Source explorer</h1>
    <span class="revision" id="revision"></span>
  </div>
  <div class="controls" role="toolbar" aria-label="View">
    <label>Scope <select id="scope"></select></label>
    <label>Show <select id="filter">
      <option value="all">All files</option>
      <option value="vox">Vox changes only</option>
      <option value="upstream">Upstream files only</option>
      <option value="demo">One demo</option>
    </select></label>
    <label id="demo-label" hidden>Demo <select id="demo"></select></label>
    <label>Size by <select id="size">
      <option value="lines">Lines</option>
      <option value="vox">Vox lines</option>
    </select></label>
    <div class="search">
      <input id="search" type="search" placeholder="Find a file or directory" autocomplete="off" spellcheck="false" aria-label="Find a file or directory">
      <ul id="search-results" class="search-results" hidden></ul>
    </div>
    <a class="button" id="tours-button" href="#tours">Tours</a>
  </div>
</header>
<div class="main" id="main">
  <section class="left" id="left">
    <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
    <div class="map" id="map">
      <canvas id="map-canvas" aria-label="Treemap of the source tree"></canvas>
      <canvas id="map-overlay" aria-hidden="true"></canvas>
      <div class="tip" id="tip" hidden></div>
      <ul class="tree-list" id="tree-list" hidden></ul>
    </div>
    <div class="legend" id="legend">
      <span><i class="sw sw-u"></i>Upstream (OCaml, C, other)</span>
      <span><i class="sw sw-m"></i>Vox-modified, by share of lines changed</span>
      <span><i class="sw sw-n"></i>Vox-new</span>
      <span><i class="sw sw-d"></i>Demo file</span>
      <label class="outline-toggle"><input type="checkbox" id="outline"> Outline demo files</label>
      <span class="hint">Click to zoom in · Esc or right-click to zoom out</span>
    </div>
    <section class="file" id="file" hidden>
      <div class="file-head">
        <div class="file-title"><strong id="file-path"></strong> <span id="file-meta" class="file-meta"></span></div>
        <div class="file-links" id="file-links"></div>
        <button type="button" class="icon" id="file-max" title="Enlarge the file view" aria-label="Enlarge the file view">⤢</button>
        <button type="button" class="icon" id="file-close" title="Close the file (Esc)" aria-label="Close the file">×</button>
      </div>
      <div class="code" id="code" tabindex="0"></div>
    </section>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<noscript><p class="noscript">The explorer needs JavaScript. The sources are on <a href="https://github.com/julesjacobs/oxcaml/tree/vox">GitHub</a>.</p></noscript>
<script src="app.js?v={{version}}" data-version="{{version}}"></script>
</body>
</html>
